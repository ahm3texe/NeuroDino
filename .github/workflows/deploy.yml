name: Deploy

# Every run moves the shared game forward to "now" and republishes the site
# (web/) to GitHub Pages, so a new viewer only has to simulate the last few
# minutes before joining in.
#
# Off until the repository variable DEPLOY_PAGES is "true" (Settings → Secrets
# and variables → Actions → Variables) and Pages uses "GitHub Actions" as its
# source; until then every run is skipped instead of failing.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Continue from the live checkpoint
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/checkpoint.json"
          if curl -fsSL "$url" -o live.json && node -e "JSON.parse(require('fs').readFileSync('live.json', 'utf8'))"; then
            mv live.json src/timeline/checkpoint.json
          else
            echo "No live checkpoint; continuing from the committed one."
          fi

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without commits.
      - name: Keep the schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
