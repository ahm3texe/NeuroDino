name: Deploy

# Every hour: move the shared game forward to "now", rebuild the site (web/)
# and upload it to the Hugging Face Space, so a new viewer only has to
# simulate the last hour before joining in.
#
# Uploads use Hugging Face Trusted Publishers: the Space's settings trust this
# repository's main branch and this workflow file, and each run exchanges
# GitHub's OIDC token for a one-hour token that can only write to the Space.
# There is no HF_TOKEN secret.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: space
  cancel-in-progress: false

env:
  SPACE: ahm3texe/neurodino
  HF_OIDC_RESOURCE: spaces/ahm3texe/neurodino
  HF: uvx --from huggingface_hub>=1.19 hf

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      # The committed checkpoint decides which timeline is shown; the live one
      # only carries it forward. Committing a fresh checkpoint (a new epoch and
      # seed) therefore restarts the shared game.
      - name: Continue from the live checkpoint
        run: |
          url="https://huggingface.co/spaces/$SPACE/resolve/main/checkpoint.json"
          if curl -fsSL "$url" -o live.json && node -e '
            const fs = require("fs");
            const live = JSON.parse(fs.readFileSync("live.json", "utf8"));
            const ours = JSON.parse(fs.readFileSync("src/timeline/checkpoint.json", "utf8"));
            const same = ["fingerprint", "epoch", "seed"].every(k => live[k] === ours[k]);
            process.exit(same && live.frame >= ours.frame ? 0 : 1);
          '; then
            mv live.json src/timeline/checkpoint.json
          else
            echo "Continuing from the committed checkpoint."
          fi

      - run: npm run build

      - name: Upload to the Space
        run: |
          cp space/README.md dist/README.md
          # Each build names its bundle by content hash; drop the old ones.
          $HF upload "$SPACE" dist . --repo-type space --delete "assets/*" \
            --commit-message "Deploy ${GITHUB_SHA::7}"

      # Every upload is a commit with a new bundle; squash the Space's history
      # once a day so it stays far below the Hub's storage limit.
      - name: Squash the Space's history
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          [ "$(date -u +%H)" = "03" ] || exit 0
          export HF_TOKEN="$($HF auth token)"
          uv run --with "huggingface_hub>=1.19" python -c '
          from huggingface_hub import HfApi
          HfApi().super_squash_history("ahm3texe/neurodino", repo_type="space",
                                       commit_message="NeuroDino site")
          '

      # GitHub pauses scheduled workflows after 60 days without commits.
      - name: Keep the schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
